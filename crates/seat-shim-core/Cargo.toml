[package]
name = "seat-shim-core"
description = "Pulsar Split per-process isolation: seat map, pure isolation decisions, AppHelp installer, DXVK per-game deploy"
# Explicit values (not `workspace = true`): this crate is also a path dependency of the
# separate `shim/` workspace (contracts.md §0.2).
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/PulsarDesk/pulsar-split"
rust-version = "1.85"

[features]
default = ["proto"]
# `From<ShimError> for split_proto::ProtoError`. Off in `shim/` (the module never talks
# the control protocol).
proto = ["dep:split-proto"]
# In-memory fakes of every system trait (`seat_shim_core::fake`) for other crates' tests.
fake = []

[dependencies]
split-proto = { path = "../split-proto", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
sha2 = "0.11"
flate2 = "1.1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinHttp",
] }
