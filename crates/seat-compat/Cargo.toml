# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "seat-compat"
description = "Pulsar Seat compatibility: preflight and coexistence checks, CPU sets and job launcher, reversible tweaks, importer, app seat API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
seat-core.workspace = true
seat-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Driver package identity (INF hash in the journal).
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Environment",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Kernel",
    "Win32_System_Restore",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
seat-core = { workspace = true, features = ["mock"] }
# Pins the service SID of the source-IP driver DACL (wfp.rs).
sha1 = "0.10"
