[package]
name = "split-session"
description = "Pulsar Split multi-session (Path A: Windows Server + RDSH): edition, RDS settings, seat users, sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Exposes `split_session::fake` (in-memory fakes) to other crates' tests.
fake = []

[dependencies]
split-proto.workspace = true
split-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# COM / WMI only (RDSH role, listener certificate thumbprint, licensing grace days).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
