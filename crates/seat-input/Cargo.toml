# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "seat-input"
description = "Pulsar Seat input backends: raw-input routing in the host session, KMDF filter client, activity, hotkey"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Seat-owned virtual pads for local seats from the shared pads crate (merge-plan.md step 8,
# `seat_input::local_pads`). Off by default; nothing enables it yet.
local-pads = ["dep:seat-pads"]

[dependencies]
seat-core.workspace = true
seat-pads = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
seat-core = { workspace = true, features = ["mock"] }
# In-memory PadManager parts for the `local_pads` hub tests.
seat-pads = { workspace = true, features = ["fake"] }
