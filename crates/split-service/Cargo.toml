[package]
name = "split-service"
description = "Pulsar Split seat service (Windows service + --console dev mode)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pulsar-split-service"
path = "src/main.rs"

[dependencies]
split-proto.workspace = true
split-core.workspace = true
split-session.workspace = true
split-termwrap.workspace = true
split-display.workspace = true
seat-audio.workspace = true
seat-stream.workspace = true
seat-pads.workspace = true
seat-shim-core.workspace = true
seat-setup.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_NetworkManagement_NetManagement",
] }

[dev-dependencies]
uuid.workspace = true
split-session = { workspace = true, features = ["fake"] }
split-termwrap = { workspace = true, features = ["fake"] }
split-display = { workspace = true, features = ["fake"] }
seat-audio = { workspace = true, features = ["fake"] }
seat-stream = { workspace = true, features = ["fake"] }
seat-pads = { workspace = true, features = ["fake"] }
seat-shim-core = { workspace = true, features = ["fake"] }
