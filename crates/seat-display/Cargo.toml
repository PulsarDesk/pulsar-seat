# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "seat-display"
description = "Pulsar Seat display backends: CCD topology, stable monitor keys, window / Display Core presenters, IddCx client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
seat-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

# One Windows binding crate for Win32 and WinRT (Display Core needs WinRT); pinned to the
# version already in Cargo.lock.
[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Devices_Display",
    "Devices_Display_Core",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Display",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows-collections = "=0.3.2"
# Journal trust checks (adapted from seat-compat winsec.rs).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
seat-core = { workspace = true, features = ["mock"] }
