# Static CRT for every Windows target: our binaries ship no Microsoft runtime DLLs
# (spec/remote/90-install.md §2.2; docs/split/agents/contracts.md). Same as shim/.cargo/config.toml.
# Applies to every cargo run started in this repository, including the separate
# crates/seat-compat/apihelper workspace (its release DLLs were already built with
# RUSTFLAGS=-C target-feature=+crt-static in CI).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
