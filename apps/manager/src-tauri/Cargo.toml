[package]
name = "pulsar-seat-manager"
description = "Pulsar Seat manager (Tauri 2 desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pulsar_seat_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pulsar-seat-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
seat-proto.workspace = true
seat-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM shell dialogs / shell links (program picker, programs.rs).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
