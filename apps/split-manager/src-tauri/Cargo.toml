[package]
name = "pulsar-split-manager"
description = "Pulsar Split manager (Tauri 2 desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pulsar_split_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
seat-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2.8"
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
