[package]
name = "split-display"
description = "Pulsar Split per-seat virtual display: backends (RDP session, Virtual-Display-Driver, own IddCx driver), modes, HDR rules, frame header, IOCTL buffers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# In-memory fakes of every system trait, for the integrator's tests.
fake = []

[dependencies]
split-proto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_Display",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Wdk_Foundation",
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemServices",
] }
