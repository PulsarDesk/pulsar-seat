# Separate workspace (not a root member, contracts.md §0.2): x64 + x86 Windows only.
[workspace]
resolver = "3"
members = ["module", "launcher", "shimctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/PulsarDesk/pulsar-split"
rust-version = "1.85"

[workspace.dependencies]
split-shim-core = { path = "../crates/split-shim-core", default-features = false }
log = "0.4"

[profile.release]
# Never unwind across an injected module's FFI boundary.
panic = "abort"
lto = "thin"
codegen-units = 1
