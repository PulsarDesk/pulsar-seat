# SPDX-License-Identifier: GPL-3.0-only
# Pulsar Seat monorepo. Layout and ownership: docs/agents/architecture.md.
[workspace]
resolver = "3"
# One manager for both seat kinds (apps/manager, merge-plan.md step 9). shim/,
# drivers/split-pad and crates/seat-compat/apihelper are separate workspaces.
members = ["crates/*", "apps/manager/src-tauri"]
# `cargo build` / `cargo test` at the root cover every crate but not the Tauri manager: it
# needs its frontend built first (`bun run build` in apps/manager, or `bun tauri build`).
default-members = [
    "crates/seat-proto",
    "crates/seat-core",
    "crates/seat-service",
    "crates/seat-session",
    "crates/seat-display",
    "crates/seat-input",
    "crates/seat-media",
    "crates/seat-compat",
    "crates/seat-host",
    "crates/seat-rdp",
    "crates/seat-release",
    # Remote seat kind (from Pulsar Split). Its split-* crates were merged into the seat-*
    # crate of the same role at merge-plan.md steps 4-8; none is left.
    "crates/seat-audio",
    "crates/seat-stream",
    "crates/seat-pads",
    "crates/seat-shim-core",
    "crates/seat-setup",
    # Native per-arch setup.exe bootstrapper (installer/scripts/build-setup.ps1).
    "crates/seat-bootstrap",
]

# drivers/split-pad (own workspace) builds into the shared target dir (target\wf). wdk-build
# finds its WDK configuration by walking up from OUT_DIR to the first Cargo.lock, which is this
# workspace's, so the pad driver's configuration is repeated here (cargo itself ignores it).
# Keep it equal to drivers/split-pad/Cargo.toml [package.metadata.wdk.driver-model].
[workspace.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 15

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/PulsarDesk/pulsar-seat"
rust-version = "1.85"

# Shared crates. Package crates add their own extra deps in their own Cargo.toml with
# explicit versions; only the contracts owner edits this table.
[workspace.dependencies]
seat-proto = { path = "crates/seat-proto" }
seat-core = { path = "crates/seat-core" }
seat-session = { path = "crates/seat-session" }
seat-display = { path = "crates/seat-display" }
seat-input = { path = "crates/seat-input" }
seat-media = { path = "crates/seat-media" }
seat-compat = { path = "crates/seat-compat" }
seat-audio = { path = "crates/seat-audio" }
seat-stream = { path = "crates/seat-stream" }
seat-pads = { path = "crates/seat-pads" }
seat-shim-core = { path = "crates/seat-shim-core" }
seat-setup = { path = "crates/seat-setup" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.1"
log = "0.4.35"
windows-sys = "0.61.2"
windows-service = "0.8.1"
winreg = "0.56.0"

[profile.release]
lto = "thin"
codegen-units = 1
